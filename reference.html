<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelf — личный трекер чтения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1712;
    --surface: #241d17;
    --surface-2: #2c231c;
    --line: #3a3026;
    --paper: #ece4d3;
    --muted: #a89a84;
    --muted-dim: #6f6353;
    --gold: #c9a227;
    --gold-dim: rgba(201, 162, 39, 0.14);
    --wine: #8a3a3a;

    --font-display: 'Lora', Georgia, serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(160deg, var(--gold), #9c7a1a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    color: #1c1712;
    font-size: 15px;
  }

  .brand-name {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
  }

  .view-switch {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }

  .view-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .view-btn.active {
    background: var(--gold);
    color: #1c1712;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .greeting {
    font-family: var(--font-display);
    font-size: 22px;
    font-style: italic;
    color: var(--paper);
    margin: 0 0 4px;
  }

  .greeting-sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }

  .add-book-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-family: inherit;
  }
  .input::placeholder { color: var(--muted-dim); }
  .input:focus { outline: none; border-color: var(--gold); }

  .btn {
    background: var(--gold);
    color: #1c1712;
    border: none;
    padding: 11px 18px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); }

  .btn.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--paper);
  }
  .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }

  .list-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .toolbar-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-dim);
  }

  .filter-chip {
    position: relative;
  }

  .filter-chip input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .filter-chip label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
  }

  .filter-chip input:checked + label {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold);
  }

  .filter-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted-dim);
  }
  .filter-chip input:checked + label .dot { background: var(--gold); }

  .book-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .empty-note {
    color: var(--muted-dim);
    font-size: 13px;
    text-align: center;
    padding: 30px 0;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  .book-row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .book-cover {
    width: 34px;
    height: 48px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: rgba(255,255,255,0.85);
  }

  .book-info { flex: 1; min-width: 0; }

  .book-title {
    font-family: var(--font-display);
    font-size: 14.5px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .book-title.done { color: var(--muted); }

  .book-author {
    font-size: 12px;
    color: var(--muted-dim);
    margin-top: 1px;
  }

  .read-check {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .check-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--muted-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
  }

  .read-check.checked .check-circle {
    background: var(--gold);
    border-color: var(--gold);
    color: #1c1712;
  }

  .read-label {
    font-size: 11.5px;
    color: var(--muted-dim);
  }

  .delete-btn {
    border: none;
    background: none;
    color: var(--muted-dim);
    font-size: 14px;
    cursor: pointer;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--wine); background: rgba(138, 58, 58, 0.15); }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 10px;
    text-align: center;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    color: var(--gold);
  }

  .stat-label {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
  }

  .session-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  .session-title {
    font-family: var(--font-display);
    font-size: 16px;
    margin: 0 0 3px;
  }

  .session-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 18px;
  }

  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
  }

  .counter-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--paper);
    font-size: 18px;
    cursor: pointer;
  }
  .counter-btn:hover { border-color: var(--gold); color: var(--gold); }
  .counter-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .counter-value {
    font-family: var(--font-mono);
    font-size: 30px;
    min-width: 60px;
    text-align: center;
  }

  .counter-reset {
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div class="app">

  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-name">Shelf</div>
    </div>
    <div class="view-switch">
      <button class="view-btn active" data-screen="shelf">Моя полка</button>
      <button class="view-btn" data-screen="stats">Статистика</button>
    </div>
  </div>

  <section class="screen active" id="screen-shelf">
    <p class="greeting">Добрый вечер</p>
    <p class="greeting-sub" id="shelfSubtitle">На полке пока пусто</p>

    <div class="add-book-row">
      <input class="input" id="bookInput" placeholder="Название книги...">
      <button class="btn" id="addBtn">Добавить на полку</button>
    </div>

    <div class="list-toolbar">
      <span class="toolbar-title">Книги</span>
      <div class="filter-chip">
        <input type="checkbox" id="filterCheckbox">
        <label for="filterCheckbox"><span class="dot"></span>Только непрочитанные</label>
      </div>
    </div>

    <div class="book-list" id="bookList"></div>
  </section>

  <section class="screen" id="screen-stats">
    <p class="greeting">Статистика</p>
    <p class="greeting-sub">Как продвигается чтение</p>

    <div class="stats-row" id="statsRow"></div>

    <div class="session-card">
      <p class="session-title">Страниц прочитано сегодня</p>
      <p class="session-sub">Обновляйте счётчик после каждой сессии чтения</p>
      <div class="counter-row">
        <button class="counter-btn" id="decBtn">−</button>
        <span class="counter-value" id="counterValue">0</span>
        <button class="counter-btn" id="incBtn">+</button>
      </div>
      <button class="btn ghost counter-reset" id="resetBtn">Сбросить счётчик</button>
    </div>
  </section>
</div>

<script>
  let state = {
    currentScreen: 'shelf',
    books: [
      { id: 1, title: 'Клара и Солнце', author: 'Кадзуо Исигуро', read: true },
      { id: 2, title: 'Маленькая жизнь', author: 'Ханья Янагихара', read: false },
      { id: 3, title: 'Пиранези', author: 'Сюзанна Кларк', read: false },
    ],
    showOnlyUnread: false,
    pagesToday: 0,
  };

  let nextId = 4;

  const coverPalette = ['#7c5a3c', '#4f6b52', '#7a3b3b', '#3f5566', '#8a6b3f', '#5c4a72'];
  function coverColor(id) {
    return coverPalette[id % coverPalette.length];
  }

  function setState(patch) {
    state = { ...state, ...patch };
    render();
  }

  function render() {
    renderScreens();
    renderSubtitle();
    renderFilterCheckbox();
    renderBookList();
    renderStats();
    renderCounter();
  }

  function renderScreens() {
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.screen === state.currentScreen);
    });
    document.querySelectorAll('.screen').forEach(el => {
      el.classList.toggle('active', el.id === 'screen-' + state.currentScreen);
    });
  }

  function renderSubtitle() {
    const count = state.books.length;
    document.getElementById('shelfSubtitle').textContent =
      count === 0 ? 'На полке пока пусто' : `На полке ${count} ${pluralBooks(count)}`;
  }

  function pluralBooks(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'книга';
    if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'книги';
    return 'книг';
  }

  function renderFilterCheckbox() {
    document.getElementById('filterCheckbox').checked = state.showOnlyUnread;
  }

  function renderBookList() {
    const container = document.getElementById('bookList');

    const visibleBooks = state.showOnlyUnread
      ? state.books.filter(b => !b.read)
      : state.books;

    if (visibleBooks.length === 0) {
      container.innerHTML = '<div class="empty-note">Нет книг, подходящих под фильтр</div>';
      return;
    }

    container.innerHTML = visibleBooks.map(book => `
      <div class="book-row" data-id="${book.id}">
        <div class="book-cover" style="background:${coverColor(book.id)}">${escapeHtml(book.title[0] || '?')}</div>
        <div class="book-info">
          <p class="book-title ${book.read ? 'done' : ''}">${escapeHtml(book.title)}</p>
          <div class="book-author">${escapeHtml(book.author)}</div>
        </div>
        <div class="read-check ${book.read ? 'checked' : ''}" data-role="toggle">
          <span class="check-circle">✓</span>
          <span class="read-label">Прочитано</span>
        </div>
        <button class="delete-btn" data-role="delete" title="Убрать с полки">✕</button>
      </div>
    `).join('');
  }

  function renderStats() {
    const total = state.books.length;
    const unread = state.books.filter(b => !b.read).length;
    const read = total - unread;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">На полке</div></div>
      <div class="stat-card"><div class="stat-value">${unread}</div><div class="stat-label">Непрочитано</div></div>
      <div class="stat-card"><div class="stat-value">${read}</div><div class="stat-label">Прочитано</div></div>
    `;
  }

  function renderCounter() {
    document.getElementById('counterValue').textContent = state.pagesToday;
    document.getElementById('decBtn').disabled = state.pagesToday === 0;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setState({ currentScreen: btn.dataset.screen });
    });
  });

  const bookInput = document.getElementById('bookInput');
  const addBtn = document.getElementById('addBtn');

  function addBook() {
    const title = bookInput.value.trim();
    if (!title) return;

    const newBook = { id: nextId++, title, author: 'Автор не указан', read: false };
    setState({ books: [...state.books, newBook] });

    bookInput.value = '';
    bookInput.focus();
  }

  addBtn.addEventListener('click', addBook);
  bookInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addBook();
  });

  document.getElementById('filterCheckbox').addEventListener('change', e => {
    setState({ showOnlyUnread: e.target.checked });
  });

  document.getElementById('bookList').addEventListener('click', e => {
    const row = e.target.closest('.book-row');
    if (!row) return;
    const id = Number(row.dataset.id);

    if (e.target.closest('[data-role="toggle"]')) {
      setState({
        books: state.books.map(b => b.id === id ? { ...b, read: !b.read } : b)
      });
    }

    if (e.target.closest('[data-role="delete"]')) {
      setState({
        books: state.books.filter(b => b.id !== id)
      });
    }
  });

  document.getElementById('incBtn').addEventListener('click', () => {
    setState({ pagesToday: state.pagesToday + 1 });
  });

  document.getElementById('decBtn').addEventListener('click', () => {
    setState({ pagesToday: Math.max(0, state.pagesToday - 1) });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    setState({ pagesToday: 0 });
  });

  render();
</script>

</body>
</html>
